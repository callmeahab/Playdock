name: Playdock macOS

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  test:
    name: Apple silicon tests
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select build tools
        run: bash Scripts/ci_setup.sh
      - name: Generated project stays in sync
        run: |
          python3 Scripts/generate_project.py
          git diff --exit-code -- Playdock.xcodeproj
      - name: SwiftPM tests
        run: swift test
      - name: Native bridge and release fixtures
        run: |
          python3 Scripts/test_steam_integration.py
          python3 Scripts/test_release.py
      - name: Xcode tests
        run: >-
          xcodebuild -project Playdock.xcodeproj -scheme Playdock
          -destination 'platform=macOS' -derivedDataPath build/TestDerivedData
          -resultBundlePath build/TestResults.xcresult test
      - name: Test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: TestResults-arm64
          path: build/TestResults.xcresult
          retention-days: 7
          if-no-files-found: ignore

  build:
    name: Apple silicon app
    needs: test
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select build tools
        run: bash Scripts/ci_setup.sh
      - name: Build app or versioned release assets
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: |
          if [[ "$IS_TAG" == true ]]; then
            python3 Scripts/package_release.py "$RELEASE_TAG"
          else
            bash Scripts/build.sh
          fi
      - name: Native window and Dock fixtures
        run: |
          python3 Scripts/Integration/NativeWindowProbe.py
          python3 Scripts/Integration/GameDockProbe.py
      - name: Apple silicon app artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Playdock-macOS-arm64
          path: build/Playdock-macOS-arm64.zip
          compression-level: 0
          retention-days: 14
          if-no-files-found: error
      - name: Release artifacts
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Playdock-release
          path: build/release/*
          compression-level: 0
          retention-days: 14
          if-no-files-found: error

  release:
    name: Draft release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: Playdock-release
          path: release
      - name: Verify downloads and prepare draft
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          sha256sum --check SHA256SUMS
          assets=(Playdock-*-macOS-arm64.zip Playdock-*-source.tar.gz BUILD_INFO.json SHA256SUMS)
          if draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft'); then
            [[ "$draft" == true ]] || { echo 'Refusing to overwrite a published release.' >&2; exit 1; }
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
            gh release edit "$RELEASE_TAG" --notes-file RELEASE_NOTES.md
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" --verify-tag --draft \
              --title "Playdock $RELEASE_TAG" --notes-file RELEASE_NOTES.md
          fi
