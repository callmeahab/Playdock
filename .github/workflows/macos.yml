name: Playdock macOS
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Xcode tests
        run: xcodebuild -project Playdock.xcodeproj -scheme Playdock -destination 'platform=macOS' test
      - name: Universal application
        run: bash Scripts/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Playdock-macOS
          path: build/Playdock-macOS.zip
          if-no-files-found: error
